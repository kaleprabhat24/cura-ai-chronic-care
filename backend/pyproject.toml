[project]
name = "cura-api"
version = "0.1.0"
description = "Cura AI backend: FastAPI service, persistent data layer, cohort loading and batch scoring"
requires-python = ">=3.12"
dependencies = [
    "cura-ml",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "fhir.resources>=7.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
cura-api = "cura_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cura_api"]

[tool.uv.sources]
cura-ml = { workspace = true }
